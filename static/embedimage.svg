    </g>

    <!-- content -->
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="500" y="315" fill="#e8eaf0" font-size="96" font-weight="700" letter-spacing="-2.5">Cozine</text>

      <!-- beta pill -->
      <g id="statusPill" transform="translate(848,274)">
        <rect id="statusPillRect" x="0" y="0" rx="17" ry="17" width="88" height="34" fill="rgba(192,96,48,0.14)" stroke="#C06030" stroke-width="1.5"/>
        <text id="statusText" x="44" y="17" text-anchor="middle" dominant-baseline="middle" fill="#C06030" font-size="18" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.2">Beta</text>
      </g>

      <text x="500" y="372" fill="#C06030" font-size="26" font-weight="600" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.4">cozine.xyz</text>
    </g>
  </g>

  <script><![CDATA[
  (function () {
    function setStatus(label) {
      var t = (label || '').trim();
      if (!t) return;
      var text = document.getElementById('statusText');
      var rect = document.getElementById('statusPillRect');
      if (!text || !rect) return;
      text.textContent = t;
      try {
        var w = Math.max(64, Math.ceil(text.getComputedTextLength() + 34));
        rect.setAttribute('width', w);
        text.setAttribute('x', w / 2);
      } catch (e) {}
    }
    function tryFetch(url) {
      return fetch(url, { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; });
    }
    tryFetch('./status.txt').then(function (s) {
      if (s && s.trim()) { setStatus(s); return; }
      return tryFetch('https://cozine.xyz/static/status.txt').then(function (s2) { if (s2) setStatus(s2); });
    });
  })();
  ]]></script>
</svg>
